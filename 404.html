<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="nf.title">Page not found · Miguel Caetano</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; padding: 40px 24px; }
    .nf__code {
      font-family: var(--font-display); font-weight: 700; line-height: .9;
      font-size: clamp(120px, 30vw, 280px);
      background: linear-gradient(180deg, #FAFAFA 20%, #3F3F46 110%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .nf h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 4vw, 40px); margin: 16px 0 10px; }
    .nf p { color: var(--muted); max-width: 420px; margin: 0 auto 32px; }
    .nf .hero__actions { justify-content: center; }
    .nf .lang { position: absolute; top: 24px; right: 24px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="hero__glow"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="pt" aria-pressed="false">PT</button>
    </div>
    <div style="position: relative;">
      <div class="nf__code">404</div>
      <h1 data-i18n="nf.heading">Page not found</h1>
      <p data-i18n="nf.text">The link may be broken or the page may have moved.</p>
      <div class="hero__actions">
        <a href="/" class="btn btn--primary" data-i18n="nf.home">Back to home</a>
      </div>
    </div>
  </main>
  <script src="/i18n.js"></script>
</body>
</html>
